schema_version: 1
registry_status: non_production
prepared_on: "2026-08-28"
connectors_active: false
date_semantics: >-
  checked_on records when a cited page was observed. It is not technical,
  editorial, or legal approval and it does not authorize a connector.
rights_note_semantics: >-
  Each terms_evidence summary is a provisional reading for review, not legal
  clearance. Admission requires the dated snapshot, content hash, and approvals
  named by the source status.
status_definitions:
  pending_technical_and_legal_review: >-
    A candidate rights page and intended use have been recorded, but the connector
    is not admitted until endpoint tests, a dated terms snapshot with content hash,
    and final technical, legal, and editorial review succeed.
  pending_rights: >-
    Identity or endpoint is known, but the intended automated collection,
    storage, transformation, or publication rights are not established.
  discovery_only: >-
    If separately admitted for discovery use, the source may nominate a lead but
    its content cannot enter a publication evidence package. This status alone
    does not enable a connector.

