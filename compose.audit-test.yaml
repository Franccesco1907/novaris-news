services:
  audit-postgres:
    image: postgres:17-alpine
    container_name: novaris-news-audit-postgres
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:?AUDIT_DB_NAME is required}
      POSTGRES_USER: ${AUDIT_MIGRATOR_USER:?AUDIT_MIGRATOR_USER is required}
      POSTGRES_PASSWORD: ${AUDIT_MIGRATOR_PASSWORD:?AUDIT_MIGRATOR_PASSWORD is required}
    ports:
      - "${AUDIT_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
